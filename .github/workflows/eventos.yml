name: Actualizar eventos desde Saraos

on:
  schedule:
    # Cada lunes a las 07:00 UTC (08:00/09:00 en Asturias)
    - cron: "0 7 * * 1"
  # Botón "Run workflow" en la pestaña Actions para lanzarlo a mano
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: eventos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow (para redimensionar carteles)
        run: pip install pillow==11.0.0

      - name: Leer eventos de Saraos y regenerar la sección
        run: python scripts/actualizar_eventos.py

      - name: Commit y push si hay cambios
        id: commit
        run: |
          git add -A index.html assets/eventos
          if git diff --cached --quiet; then
            echo "Sin cambios en los eventos."
            echo "cambios=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar eventos desde Saraos"
          git push
          echo "cambios=true" >> "$GITHUB_OUTPUT"

      - name: Volver a publicar GitHub Pages
        if: steps.commit.outputs.cambios == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages se publicará con el push."
